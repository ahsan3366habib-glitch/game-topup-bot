<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopUpZone BD — Admin</title><style>body{margin:0;background:#050816;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#0b1427;border:1px solid #203452;border-radius:16px;padding:16px;margin-bottom:12px}input,button{padding:12px;border-radius:10px;border:1px solid #284363;background:#07101f;color:#fff}button{cursor:pointer;background:#087dff;border:0;font-weight:800}.danger{background:#d6385b}.ok{background:#0a9b69}.muted{color:#92a5c0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}.order{line-height:1.7}.status{font-weight:800}</style></head><body><div class="wrap"><div class="card" id="loginCard"><h1>🛡️ TopUpZone BD</h1><p class="muted">Admin Panel</p><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="loginMsg"></p></div><div id="panel" class="hidden"><div class="card row"><h1 style="margin:0 auto 0 0">📋 Orders</h1><button onclick="loadOrders()">Refresh</button><button class="danger" onclick="logout()">Logout</button></div><div id="orders"></div></div></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){const password=document.getElementById('password').value;const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const d=await r.json();if(d.ok){loginCard.classList.add('hidden');panel.classList.remove('hidden');loadOrders()}else loginMsg.textContent='❌ '+(d.error||'Login failed')}
async function loadOrders(){const r=await fetch('/api/admin/orders');if(r.status===401){loginCard.classList.remove('hidden');panel.classList.add('hidden');return}const d=await r.json();orders.innerHTML=d.orders.map(o=>`<div class="card order"><b>🆔 #${esc(o.id)}</b> — <span class="status">${esc(o.status)}</span><br>👤 User: ${esc(o.user_id)} ${o.username?'@'+esc(o.username):''}<br>🆔 UID: <b>${esc(o.player_id)}</b><br>📦 ${esc(o.package_name)}<br>💰 ৳${esc(o.amount)}<br>💳 ${esc(o.payment_method||'-')}<br>🧾 TxnID: <b>${esc(o.txn_id)}</b><br><span class="muted">${esc(o.created_at)}</span><div class="row" style="margin-top:10px">${o.status==='payment_pending'?`<button class="ok" onclick="setStatus(${o.id},'payment_verified')">✅ PAYMENT VERIFIED</button>`:''}${o.status==='payment_verified'?`<button onclick="setStatus(${o.id},'completed')">🎮 TOP-UP DONE</button>`:''}${o.status==='payment_pending'||o.status==='payment_verified'?`<button class="danger" onclick="setStatus(${o.id},'rejected')">❌ REJECT</button>`:''}</div></div>`).join('')||'<div class="card">No orders.</div>'}
async function setStatus(id,status){const r=await fetch('/api/admin/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!d.ok)alert(d.error||'Failed');loadOrders()}async function logout(){await fetch('/admin/logout',{method:'POST'});location.reload()}loadOrders();
</script></body></html>
